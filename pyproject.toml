[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qft-einstein-bridge-repro"
version = "0.1.0"
description = "Reproducibility package for the QFT-Einstein bridge: same coefficients, same loop library, same T-parity axiom; spinor-trace n separates the two sectors."
authors = [
    { name = "Sandro Bucciarelli", email = "sandro.bucciarelli89@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["bridge note", "QFT-GR", "common carrier", "reproducibility"]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/TerraSignum/qft-einstein-bridge-repro"
Homepage = "https://github.com/TerraSignum/qft-einstein-bridge-repro"
Issues = "https://github.com/TerraSignum/qft-einstein-bridge-repro/issues"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"